<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Admin Panel • Viral Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --primary: #8b5cf6;
  --primary-2: #ec4899;
  --primary-gradient: linear-gradient(135deg, #8b5cf6, #ec4899);
  --text-main: #1f1b33;
  --text-muted: #6b7280;
  --glass: rgba(255, 255, 255, 0.62);
  --glass-strong: rgba(255, 255, 255, 0.84);
  --glass-border: rgba(255, 255, 255, 0.9);
  --shadow: 0 10px 30px rgba(94, 63, 190, .12);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh;
  font-family: 'Poppins', 'Hind Siliguri', sans-serif;
  color: var(--text-main);
  background-color: #eef0ff;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(139, 92, 246, .30), transparent 42%),
    radial-gradient(circle at 88% 16%, rgba(236, 72, 153, .22), transparent 42%),
    radial-gradient(circle at 50% 100%, rgba(56, 189, 248, .22), transparent 45%);
  background-attachment: fixed;
  padding: 16px; padding-bottom: 40px;
}
body::before, body::after {
  content: ""; position: fixed; width: 340px; height: 340px; border-radius: 50%;
  filter: blur(70px); opacity: .5; z-index: -1; pointer-events: none;
}
body::before { background: radial-gradient(circle, #a78bfa, transparent 70%); top: -130px; left: -110px; animation: floatA 16s ease-in-out infinite; }
body::after { background: radial-gradient(circle, #f9a8d4, transparent 70%); bottom: -130px; right: -110px; animation: floatB 20s ease-in-out infinite; }
@keyframes floatA { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(50px, 60px, 0) scale(1.12); } }
@keyframes floatB { 0%, 100% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-60px, -50px, 0) scale(1.1); } }

.container { max-width: 640px; margin: 0 auto; }

.admin-header {
  position: relative; overflow: hidden; text-align: center;
  padding: 24px 18px; border-radius: 26px; margin-bottom: 20px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .9);
}
.admin-header h2 {
  margin: 0; font-size: 24px; font-weight: 800; letter-spacing: .4px;
  background: var(--primary-gradient);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.admin-header p { margin: 6px 0 0; font-size: 13px; color: var(--text-muted); font-weight: 500; }

.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.dash-btn {
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 22px; padding: 22px 12px;
  text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  box-shadow: 0 8px 22px rgba(94, 63, 190, .08);
  transition: transform .2s;
  font-family: inherit; color: var(--text-main);
}
.dash-btn:active { transform: scale(.96); }
.dash-btn i { font-size: 28px; color: var(--primary); }
.dash-btn span { font-weight: 600; font-size: 14px; }

.stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card {
  flex: 1; min-width: 100px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 16px 10px;
  text-align: center;
  box-shadow: 0 8px 22px rgba(94, 63, 190, .08);
}
.stat-card .stat-num {
  font-size: 22px; font-weight: 800;
  background: var(--primary-gradient);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.stat-card .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

.section { display: none; animation: fadeIn .35s ease both; }
.section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, .7);
}
.header-row h3 { margin: 0; font-size: 18px; font-weight: 700; color: #241f3d; }
.back-btn {
  background: rgba(255, 255, 255, .75);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, .95);
  color: #4b5563; padding: 8px 16px; border-radius: 50px;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 12px rgba(94, 63, 190, .08);
  transition: transform .2s;
}
.back-btn:active { transform: scale(.95); }

label.help-text {
  font-size: 12px; color: #5b5570; font-weight: 600;
  margin-bottom: 5px; display: block;
}
input, select, textarea {
  width: 100%; padding: 14px 16px; margin-bottom: 12px;
  background: rgba(255, 255, 255, .75);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, .95);
  color: var(--text-main); border-radius: 14px;
  font-family: inherit; font-size: 14px; outline: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
  transition: border-color .25s, box-shadow .25s;
}
input:focus, select:focus, textarea:focus {
  border-color: rgba(139, 92, 246, .55);
  box-shadow: 0 0 0 4px rgba(139, 92, 246, .12), inset 0 1px 0 rgba(255, 255, 255, .9);
}
input[type="file"] {
  padding: 12px;
  background: rgba(255, 255, 255, .85);
  border: 2px dashed rgba(139, 92, 246, .5);
  cursor: pointer;
}
.action-btn {
  width: 100%; padding: 14px; border-radius: 14px; border: none;
  background: var(--primary-gradient); color: #fff;
  font-weight: 700; font-size: 14px; letter-spacing: .4px;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 8px 20px rgba(236, 72, 153, .32);
  transition: transform .2s;
}
.action-btn:active { transform: scale(.97); }
.action-btn.small { padding: 10px; font-size: 13px; }
.action-btn:disabled { opacity: .6; cursor: not-allowed; }

.list-item {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 16px; padding: 12px 14px; margin-top: 10px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 6px 18px rgba(94, 63, 190, .06);
}
.list-item img {
  width: 44px; height: 44px; border-radius: 10px; object-fit: cover;
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  flex-shrink: 0;
}
.list-item .info { flex: 1; min-width: 0; }
.list-item .info b { font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .info small { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-top: 3px; }
.list-item .info small i { font-size: 10px; color: var(--primary); }
.del-btn {
  background: #ef4444; color: #fff; border: none;
  padding: 7px 12px; border-radius: 10px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600;
  transition: transform .2s; flex-shrink: 0;
}
.del-btn:active { transform: scale(.9); }

.badge-pill {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(139, 92, 246, .12); color: #6d28d9;
  padding: 3px 10px; border-radius: 50px; font-size: 11px; font-weight: 600;
}

.admin-search { position: relative; margin-bottom: 14px; }
.admin-search input { padding-right: 46px; margin-bottom: 0; }
.admin-search i {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  color: #9ca3af; font-size: 14px;
}

.img-preview {
  display: none; margin: 6px 0 14px;
  border-radius: 16px; overflow: hidden;
  border: 2px solid rgba(139, 92, 246, .3);
  position: relative;
}
.img-preview img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
.img-preview .remove-img {
  position: absolute; top: 8px; right: 8px;
  background: #ef4444; color: #fff; border: none;
  width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(239, 68, 68, .4);
}
.upload-progress {
  display: none; margin: 8px 0;
  height: 6px; background: rgba(139, 92, 246, .15);
  border-radius: 50px; overflow: hidden;
}
.upload-progress .bar {
  height: 100%; width: 0%;
  background: var(--primary-gradient);
  border-radius: 50px;
  transition: width .3s ease;
}

@media (max-width: 400px) {
  .dashboard-grid { grid-template-columns: 1fr; }
  .stat-card { min-width: 80px; }
}
</style>
</head>
<body>

<div class="container">
  <div id="dashboard">
    <div class="admin-header">
      <h2>👑 Admin Control</h2>
      <p>Viral Zone • Super Panel</p>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="statVideos">0</div>
        <div class="stat-label">Videos</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statViews">0</div>
        <div class="stat-label">Total Views</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statCats">0</div>
        <div class="stat-label">Categories</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statLinks">0</div>
        <div class="stat-label">Links</div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="dash-btn" onclick="openSection('secVideo')"><i class="fas fa-video"></i> <span>ভিডিও আপলোড</span></div>
      <div class="dash-btn" onclick="openSection('secAds')"><i class="fas fa-sack-dollar"></i> <span>অ্যাড সেটআপ</span></div>
      <div class="dash-btn" onclick="openSection('secCat')"><i class="fas fa-tags"></i> <span>ক্যাটাগরি</span></div>
      <div class="dash-btn" onclick="openSection('secLinks')"><i class="fas fa-link"></i> <span>মেনু লিংক</span></div>
      <div class="dash-btn" onclick="openSection('secSettings')"><i class="fas fa-cogs"></i> <span>সেটিংস</span></div>
    </div>
  </div>

  <!-- VIDEO UPLOAD -->
  <div id="secVideo" class="section">
    <div class="header-row">
      <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>🎬 ভিডিও আপলোড</h3>
      <div></div>
    </div>
    <label class="help-text">নাম</label>
    <input type="text" id="vTitle" placeholder="Video Title">
    
    <label class="help-text">📷 ছবি সিলেক্ট করুন (ImgBB-তে অটো আপলোড হবে)</label>
    <input type="file" id="vFile" accept="image/*">
    <div class="upload-progress" id="uploadProgress"><div class="bar" id="uploadBar"></div></div>
    <div class="img-preview" id="imgPreview">
      <img id="previewImg" alt="Preview">
      <button class="remove-img" onclick="removePreview()"><i class="fas fa-times"></i></button>
    </div>

    <label class="help-text">অথবা ছবির URL (ঐচ্ছিক)</label>
    <input type="text" id="vImage" placeholder="https://...">

    <label class="help-text">ডাউনলোড লিংক</label>
    <input type="text" id="vLink" placeholder="Download link...">
    
    <div style="display:flex; gap:10px;">
      <select id="vCat" style="flex:1"><option value="all">Category</option></select>
      <input type="number" id="vReq" value="1" style="flex:1" placeholder="Ads Count">
    </div>
    <button class="action-btn" id="publishBtn" onclick="uploadVideo()">PUBLISH VIDEO</button>

    <div style="margin-top:22px;">
      <div class="admin-search">
        <input type="text" id="videoSearch" placeholder="ভিডিও খুঁজুন..." oninput="filterVideoList()">
        <i class="fas fa-search"></i>
      </div>
      <div id="vList" style="margin-top:8px;"></div>
    </div>
  </div>

  <!-- ADS SETUP -->
  <div id="secAds" class="section">
    <div class="header-row">
      <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>💰 অ্যাড সেটআপ</h3>
      <div></div>
    </div>

    <div style="background:rgba(255,255,255,.55); padding:14px; border-radius:18px; margin-bottom:15px; border:1px solid rgba(236,72,153,.3);">
      <h4 style="margin:0 0 10px; color:#ec4899; font-size:15px;">🚀 Monetag (2nd Ad)</h4>
      <label class="help-text">Zone ID (Example: 10110498)</label>
      <input type="number" id="monetagId" placeholder="10110498">
      <button class="action-btn small" onclick="saveMonetag()">Save Monetag ID</button>
    </div>

    <div style="background:rgba(255,255,255,.55); padding:14px; border-radius:18px; margin-bottom:15px;">
      <h4 style="margin:0 0 10px; color:#1f1b33; font-size:15px;">Adsgram Block ID</h4>
      <input type="text" id="adsgramId" placeholder="Example: 12345">
      <button class="action-btn small" onclick="addAdsgramId()">Add ID</button>
      <div id="adsgramList"></div>
    </div>

    <div style="background:rgba(255,255,255,.55); padding:14px; border-radius:18px;">
      <h4 style="margin:0 0 10px; color:#8b5cf6; font-size:15px;">Banner Ads (HTML)</h4>
      <textarea id="bannerCode" style="height:70px" placeholder='<a href="..."><img src="..."></a>'></textarea>
      <button class="action-btn small" onclick="addBanner()">Add Banner</button>
      <div id="bannerList"></div>
    </div>
  </div>

  <!-- CATEGORY -->
  <div id="secCat" class="section">
    <div class="header-row">
      <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>🏷️ ক্যাটাগরি</h3>
      <div></div>
    </div>
    <input type="text" id="cId" placeholder="ID (viral)">
    <input type="text" id="cName" placeholder="Name (ভাইরাল)">
    <button class="action-btn" onclick="addCategory()">Add</button>
    <div id="catList"></div>
  </div>

  <!-- LINKS -->
  <div id="secLinks" class="section">
    <div class="header-row">
      <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>🔗 লিংক</h3>
      <div></div>
    </div>
    <input type="text" id="lTitle" placeholder="Title">
    <input type="text" id="lUrl" placeholder="URL">
    <button class="action-btn" onclick="addLink()">Add</button>
    <div id="linkList"></div>
  </div>

  <!-- SETTINGS -->
  <div id="secSettings" class="section">
    <div class="header-row">
      <button class="back-btn" onclick="goHome()"><i class="fas fa-arrow-left"></i> Back</button>
      <h3>⚙️ সেটিংস</h3>
      <div></div>
    </div>
    <label class="help-text">Telegram Bot App Link</label>
    <input type="text" id="sBot" placeholder="https://t.me/your_bot/app">
    <label class="help-text">Tutorial ID (Youtube)</label>
    <input type="text" id="sTut">
    <label class="help-text">Daily Limit</label>
    <input type="number" id="sLimit">
    <button class="action-btn" onclick="saveSettings()">Save</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhKIxpistqd8LKSQFqPai44NTAXJ3SPoI",
  authDomain: "viral-link-ee0a0.firebaseapp.com",
  databaseURL: "https://viral-link-ee0a0-default-rtdb.firebaseio.com",
  projectId: "viral-link-ee0a0",
  storageBucket: "viral-link-ee0a0.firebasestorage.app",
  messagingSenderId: "860525425689",
  appId: "1:860525425689:web:f3965e0da589649e4a6688",
  measurementId: "G-YHW3PQKK9V"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= IMGBB CONFIG ================= */
const IMGBB_API_KEY = "d7927c2398b06df444ad5f6ad8f1f31d";
const FALLBACK_IMG = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
  "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"400\" height=\"225\"><defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#8b5cf6\"/><stop offset=\"1\" stop-color=\"#ec4899\"/></linearGradient></defs><rect width=\"400\" height=\"225\" fill=\"url(#g)\"/><circle cx=\"200\" cy=\"98\" r=\"34\" fill=\"rgba(255,255,255,0.9)\"/><path d=\"M190 80 L222 98 L190 116 Z\" fill=\"#8b5cf6\"/><text x=\"200\" y=\"170\" font-size=\"18\" font-family=\"Arial\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.95)\">VIDEO</text></svg>"
);

let allVideosAdmin = [];
let videoSearchQuery = '';
let uploadedImageUrl = ''; // ImgBB থেকে আসা URL

/* ================= NAVIGATION ================= */
window.openSection = (id) => {
  document.getElementById('dashboard').style.display = 'none';
  document.querySelectorAll('.section').forEach(d => d.classList.remove('active'));
  document.getElementById(id).classList.add('active');
};
window.goHome = () => {
  document.querySelectorAll('.section').forEach(d => d.classList.remove('active'));
  document.getElementById('dashboard').style.display = 'block';
};
window.del = (path) => {
  if (confirm('Delete?')) remove(ref(db, path));
};

/* ================= STATS ================= */
function updateStats() {
  onValue(ref(db, 'videos'), s => {
    const vids = s.val() ? Object.values(s.val()) : [];
    document.getElementById('statVideos').innerText = vids.length;
    const totalViews = vids.reduce((sum, v) => sum + (v.view_count || 0), 0);
    document.getElementById('statViews').innerText = totalViews;
  });
  onValue(ref(db, 'filters'), s => {
    document.getElementById('statCats').innerText = s.val() ? Object.keys(s.val()).length : 0;
  });
  onValue(ref(db, 'links'), s => {
    document.getElementById('statLinks').innerText = s.val() ? Object.keys(s.val()).length : 0;
  });
}
updateStats();

/* ================= IMAGE PREVIEW + IMGBB UPLOAD ================= */

// ফাইল সিলেক্ট হলে প্রিভিউ দেখাও
document.getElementById('vFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // লোকাল প্রিভিউ দেখাও
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('imgPreview').style.display = 'block';
  };
  reader.readAsDataURL(file);

  // সাথে সাথে ImgBB-তে আপলোড শুরু করো
  await uploadToImgBB(file);
});

// প্রিভিউ মুছে ফেলা
window.removePreview = () => {
  document.getElementById('vFile').value = '';
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('previewImg').src = '';
  uploadedImageUrl = '';
};

// ImgBB-তে আপলোড
async function uploadToImgBB(file) {
  const progressEl = document.getElementById('uploadProgress');
  const barEl = document.getElementById('uploadBar');
  progressEl.style.display = 'block';
  barEl.style.width = '30%';

  try {
    const formData = new FormData();
    formData.append('image', file);

    barEl.style.width = '60%';
    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
      method: 'POST',
      body: formData
    });
    barEl.style.width = '85%';

    const data = await res.json();
    if (data.success) {
      uploadedImageUrl = data.data.url;
      document.getElementById('vImage').value = uploadedImageUrl;
      barEl.style.width = '100%';
      setTimeout(() => { progressEl.style.display = 'none'; barEl.style.width = '0%'; }, 800);
    } else {
      throw new Error(data.error?.message || 'Upload failed');
    }
  } catch (err) {
    alert('❌ Image upload failed: ' + err.message);
    progressEl.style.display = 'none';
    barEl.style.width = '0%';
    removePreview();
  }
}

/* ================= VIDEO UPLOAD ================= */
window.uploadVideo = async () => {
  const t = document.getElementById('vTitle').value.trim();
  const l = document.getElementById('vLink').value.trim();
  let imageUrl = (uploadedImageUrl || document.getElementById('vImage').value).trim();

  if (!t || !l) { alert('Title এবং Link অবশ্যই দিতে হবে!'); return; }
  if (!imageUrl) { alert('অনুগ্রহ করে ছবি সিলেক্ট করুন বা URL দিন'); return; }

  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  btn.innerText = 'PUBLISHING...';

  push(ref(db, 'videos'), {
    name: t,
    image_url: imageUrl,
    download_link: l,
    category: document.getElementById('vCat').value,
    ad_watches_required: parseInt(document.getElementById('vReq').value) || 1,
    created_at: Date.now(),
    view_count: 0
  }).then(() => {
    alert('✅ Video Published!');
    // Reset
    document.getElementById('vTitle').value = '';
    document.getElementById('vImage').value = '';
    document.getElementById('vLink').value = '';
    document.getElementById('vFile').value = '';
    document.getElementById('imgPreview').style.display = 'none';
    uploadedImageUrl = '';
    btn.disabled = false;
    btn.innerText = 'PUBLISH VIDEO';
  }).catch(err => {
    alert('❌ Error: ' + err.message);
    btn.disabled = false;
    btn.innerText = 'PUBLISH VIDEO';
  });
};

/* ================= VIDEO LIST ================= */
function renderVideoList() {
  const d = document.getElementById('vList');
  d.innerHTML = '';
  const q = videoSearchQuery.toLowerCase();
  const filtered = allVideosAdmin.filter(v => v.name.toLowerCase().includes(q));

  if (filtered.length === 0) {
    d.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:20px;">কোনো ভিডিও নেই</p>';
    return;
  }

  filtered.forEach(v => {
    const imgSrc = (v.image_url && String(v.image_url).trim()) ? v.image_url : FALLBACK_IMG;
    const views = v.view_count || 0;
    d.innerHTML += `
      <div class="list-item">
        <img src="${imgSrc}" alt="" loading="lazy" referrerpolicy="no-referrer"
             onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
        <div class="info">
          <b>${v.name}</b>
          <small>
            <i class="fas fa-eye"></i> ${views} views
            <span class="badge-pill" style="margin-left:6px;">${v.category || 'all'}</span>
          </small>
        </div>
        <button class="del-btn" onclick="del('videos/${v.id}')">X</button>
      </div>
    `;
  });
}

onValue(ref(db, 'videos'), s => {
  allVideosAdmin = [];
  if (s.val()) {
    Object.entries(s.val()).reverse().forEach(([k, v]) => {
      allVideosAdmin.push({ id: k, ...v });
    });
  }
  renderVideoList();
});

window.filterVideoList = () => {
  videoSearchQuery = document.getElementById('videoSearch').value;
  renderVideoList();
};

/* ================= ADS ================= */
window.saveMonetag = () => {
  const mid = document.getElementById('monetagId').value;
  update(ref(db, 'settings'), { monetag_id: mid }).then(() => alert('Monetag ID Saved!'));
};

window.addAdsgramId = () => {
  const v = document.getElementById('adsgramId').value;
  if (v) push(ref(db, 'ads_config/interstitial_ids'), v);
};
onValue(ref(db, 'ads_config/interstitial_ids'), s => {
  const d = document.getElementById('adsgramList');
  d.innerHTML = '';
  if (s.val()) Object.entries(s.val()).forEach(([k, v]) =>
    d.innerHTML += `<div class="list-item"><span>${v}</span><button class="del-btn" onclick="del('ads_config/interstitial_ids/${k}')">X</button></div>`
  );
});

window.addBanner = () => {
  const v = document.getElementById('bannerCode').value;
  if (v) push(ref(db, 'ads_config/banners'), v);
};
onValue(ref(db, 'ads_config/banners'), s => {
  const d = document.getElementById('bannerList');
  d.innerHTML = '';
  if (s.val()) Object.entries(s.val()).forEach(([k, v]) =>
    d.innerHTML += `<div class="list-item"><small>${v.substring(0, 30)}...</small><button class="del-btn" onclick="del('ads_config/banners/${k}')">X</button></div>`

/* ================= SETTINGS ================= */
window.saveSettings = () => {
  update(ref(db, 'settings'), {
    tutorial_id: document.getElementById('sTut').value,
    ads_limit: parseInt(document.getElementById('sLimit').value),
    bot_app_link: document.getElementById('sBot').value
  }).then(() => alert('Settings Saved'));
};
onValue(ref(db, 'settings'), s => {
  if (s.val()) {
    document.getElementById('sTut').value = s.val().tutorial_id || '';
    document.getElementById('sLimit').value = s.val().ads_limit || 20;
    document.getElementById('sBot').value = s.val().bot_app_link || '';
    document.getElementById('monetagId').value = s.val().monetag_id || '';
  }
});

/* ================= CATEGORY ================= */
window.addCategory = () => {
  const i = document.getElementById('cId').value;
  const n = document.getElementById('cName').value;
  if (i && n) push(ref(db, 'filters'), { id: i, name: n });
};
onValue(ref(db, 'filters'), s => {
  const d = document.getElementById('catList');
  const sel = document.getElementById('vCat');
  d.innerHTML = '';
  sel.innerHTML = '<option value="all">All</option>';
  if (s.val()) {
    Object.entries(s.val()).forEach(([k, v]) => {
      d.innerHTML += `<div class="list-item"><span>${v.name} (${v.id})</span><button class="del-btn" onclick="del('filters/${k}')">X</button></div>`;
      sel.innerHTML += `<option value="${v.id}">${v.name}</option>`;
    });
  }
});

/* ================= LINKS ================= */
window.addLink = () => {
  const t = document.getElementById('lTitle').value;
  const u = document.getElementById('lUrl').value;
  if (t && u) push(ref(db, 'links'), { title: t, url: u });
};
onValue(ref(db, 'links'), s => {
  const d = document.getElementById('linkList');
  d.innerHTML = '';
  if (s.val()) Object.entries(s.val()).forEach(([k, v]) =>
    d.innerHTML += `<div class="list-item"><span>${v.title}</span><button class="del-btn" onclick="del('links/${k}')">X</button></div>`
  );
});
</script>
