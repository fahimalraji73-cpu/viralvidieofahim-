body{

}
body::before,body::after{
  content:"";position:fixed;width:340px;height:340px;border-radius:50%;
  filter:blur(70px);opacity:.5;z-index:-1;pointer-events:none;
}
body::before{background:radial-gradient(circle,#a78bfa,transparent 70%);top:-130px;left:-110px;animation:floatA 16s ease-in-out infinite;}
body::after{background:radial-gradient(circle,#f9a8d4,transparent 70%);bottom:-130px;right:-110px;animation:floatB 20s ease-in-out infinite;}

                attempts++;
                if (typeof window['show_' + zoneId] === 'function') {
                    clearInterval(checkFn);
                    resolved = true;
                    console.log('✅ Monetag SDK ready, zone:', zoneId);
                    resolve(true);
                } else if (attempts > 30) {
                    clearInterval(checkFn);
                    resolved = true;
                    window.__mtDyn='script loaded but show_ function not created';
                    console.warn('⚠️ Monetag show_ function not created after 30 checks');
                    resolve(false);
                }
            }, 250);
        };
        script.onerror = () => {
            if (resolved) return;
            resolved = true;
            window.__mtDyn='script blocked/failed to load';
            console.error('❌ Monetag SDK failed to load:', sdkUrl);
            resolve(false);
        };

        document.head.appendChild(script);

        setTimeout(() => {
            if (!resolved) {
                resolved = true;
                const ok = typeof window['show_' + zoneId] === 'function';
                console.log('⏰ Monetag final timeout, function exists?', ok);
                resolve(ok);
            }
        }, 10000);
    });
}

function init() {
    onValue(ref(db, 'settings'), async s => {
        if(s.val()) {
            settings = s.val();
            if(settings.tutorial_id) {
                document.getElementById('tutEmbed').innerHTML = 
                    `<iframe src="${settings.tutorial_id}" style="width:100%;height:100%;border:0" allowfullscreen></iframe>`;
            }

            if(settings.monetag_id && settings.monetag_sdk_url) {
                if(!monetagLoaded || monetagZoneId !== settings.monetag_id) {
                    monetagZoneId = settings.monetag_id;
                    monetagSdkUrl = settings.monetag_sdk_url;
                    monetagLoaded = await loadMonetagSDK(monetagZoneId, monetagSdkUrl);
                    console.log('🔍 Monetag ready:', monetagLoaded, '| show_' + monetagZoneId + ':', typeof window['show_' + monetagZoneId]);
                    // ✅ Preload first ad
                    if (monetagLoaded) {
                        window['show_' + monetagZoneId]({
                            type: 'preload',
                            ymid: String(currentUserId),
                            requestVar: 'preload'
                        }).then(() => {
                            console.log('✅ Monetag ad preloaded');
                        }).catch(() => {
                            console.warn('⚠️ Monetag preload failed (normal on first load)');
                        });
                    }
                }
            }
        }
    });

    onValue(ref(db, 'ads_config'), s => {
        adsgramIds = []; bannerAds = [];
        if(s.val()) {
            if(s.val().interstitial_ids) Object.values(s.val().interstitial_ids).forEach(id => adsgramIds.push(id));
            if(s.val().banners) Object.values(s.val().banners).forEach(b => bannerAds.push(b));
        }
        renderCards();
    });

    onValue(ref(db, 'links'), s => { menuLinks=[]; if(s.val()) Object.values(s.val()).forEach(v=>menuLinks.push(v)); renderLinks(); });
    onValue(ref(db, 'filters'), s => { filters=[]; if(s.val()) Object.values(s.val()).forEach(v=>filters.push(v)); });

    onValue(ref(db, 'videos'), s => {
        allVideos = [];
        if(s.val()) Object.entries(s.val()).forEach(([k,v])=>allVideos.push({id:k,...v}));
        allVideos.reverse();
        renderFilters();
        renderCards();
        renderLiked();
        checkDeepLink();
    });
}

function checkDeepLink() {
    const startParam = tg.initDataUnsafe?.start_param || new URLSearchParams(window.location.search).get('file');
    if(startParam) {
        let videoId = startParam.split('_')[0];
        const targetVideo = allVideos.find(v => v.id === videoId);
        if(targetVideo) { openSingle(videoId); }
        else { showToast("ভিডিওটি খুঁজে পাওয়া যায়নি!"); }
    }
}

function getCount(cat) {
    if(cat === 'all') return allVideos.length;
    if(cat === 'trending') return Math.min(10, allVideos.length);
    return allVideos.filter(v => v.category === cat).length;
}

function renderFilters() {
    const div = document.getElementById('filterContainer');
    let html = `<button class="filter-btn trending-btn ${currentFilter==='trending'?'active':''}" onclick="setFilter('trending', this)">🔥 Trending <span class="badge">${getCount('trending')}</span></button>`;
    html += `<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all', this)">All <span class="badge">${getCount('all')}</span></button>`;
    filters.forEach(f => {
        html += `<button class="filter-btn ${currentFilter===f.id?'active':''}" onclick="setFilter('${f.id}', this)">${f.name} <span class="badge">${getCount(f.id)}</span></button>`;
    });
    div.innerHTML = html;
}

function getFilteredList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    if (currentFilter === 'trending') {
        return [...allVideos]
            .sort((a,b) => (b.view_count||0) - (a.view_count||0))
            .slice(0, 10)
            .filter(v => v.name.toLowerCase().includes(q));
    }
    return allVideos.filter(v => 
        v.name.toLowerCase().includes(q) && 
        (currentFilter==='all' || v.category===currentFilter)
    );
}

function renderCards() {
    const div = document.getElementById('cards');
    const list = getFilteredList();
    div.innerHTML = list.length ? '' : '<p class="empty-text">😕 কোনো ভিডিও পাওয়া যায়নি</p>';
    list.forEach((v, index) => {
        div.appendChild(createCard(v));
        if ((index + 1) % 2 === 0 && bannerAds.length > 0) {
            const bannerDiv = document.createElement('div');
            bannerDiv.className = 'banner-wrapper';
            bannerDiv.innerHTML = bannerAds[Math.floor(Math.random() * bannerAds.length)];
            div.appendChild(bannerDiv);
        }
    });
}

function isNewVideo(created_at) {
    if (!created_at) return false;
    const ageMs = Date.now() - created_at;
    return ageMs > 0 && ageMs < (24 * 60 * 60 * 1000);
}

function createCard(v) {
    const liked = getLiked().includes(v.id);
    const count = getProgress(v.id);
    const req = v.ad_watches_required || 1;
    const isUnlocked = count >= req;
    const imgSrc = (v.image_url && String(v.image_url).trim()) ? v.image_url : FALLBACK_IMG;
    const showNew = isNewVideo(v.created_at);

    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
        <div class="media">
            <img src="${imgSrc}" alt="" loading="lazy" referrerpolicy="no-referrer"
                 onerror="this.onerror=null;this.src='${FALLBACK_IMG}'">
            ${showNew ? '<div class="new-badge"><i class="fas fa-bolt"></i> NEW</div>' : ''}
            <button class="heart-btn" onclick="toggleLike('${v.id}')"><i class="${liked?'fas':'far'} fa-heart" style="color:${liked?'#ec4899':'#9ca3af'}"></i></button>
        </div>
        <div class="meta">
            <div class="meta-header">
                <h3>${v.name}</h3>
            </div>
            <div class="actions">
                <button class="unlock-btn ${isUnlocked?'done':''}" onclick="handleUnlock('${v.id}', '${v.download_link}', ${req})">
                    ${isUnlocked ? '<i class="fas fa-download"></i> DOWNLOAD' : `<i class="fas fa-play"></i> UNLOCK (${count}/${req})`}
                </button>
                <button class="link-btn" onclick="copyLink('${v.id}')"><i class="fas fa-link"></i></button>
            </div>
        </div>`;
    return el;
}

window.copyLink = (id) => {
    const botLink = settings.bot_app_link || "";
    if(!botLink) {
        const url = window.location.origin + window.location.pathname + '?file=' + id;
        navigator.clipboard.writeText(url);
        showToast("Web Link Copied!");
        return;
    }
    const tgLink = `${botLink}?startapp=${id}_${currentUserId}`;
    navigator.clipboard.writeText(tgLink);
    showToast("Share Link Copied!");
}

/* ============ UNLOCK FLOW ============ */
window.handleUnlock = (id, link, req) => {
    const count = getProgress(id);
    if(count >= req) { window.open(link, '_blank'); return; }
    if(getDaily() >= (settings.ads_limit||20)) { showToast("Daily limit reached!"); return; }

    const hasMonetag = !!monetagZoneId;
    const hasAdsgram = window.Adsgram && adsgramIds.length > 0 && isInsideTelegram();

    if(!hasMonetag && !hasAdsgram) {
        // ❌ কোনো অ্যাডই নেই → unlock হবে না
        showToast("❌ কোনো অ্যাড সেট করা নেই! অ্যাডমিনকে জানান।");
        return;
    }

    showOverlay("Processing...");
    playMixedSequence(0, id, link, req);
}

function isInsideTelegram() {
    return !!(window.Telegram?.WebApp?.initData) && tg.initData !== '';
}

function doUnlock(id, req) {
    const currentProgress = getProgress(id) + 1;
    localStorage.setItem('p_' + id, currentProgress);
    incDaily();
    if (currentProgress >= req) {
        incrementViewCount(id);
        trackUnlock(id);
    }
    renderCards();
    if (document.getElementById('singleView').style.display === 'block') {
        openSingle(id);
    }
    showToast("✅ Unlock Successful!");
    tg.HapticFeedback?.notificationOccurred('success');
}

function playMixedSequence(step, videoId, link, req) {
    const txt = document.getElementById('loadingText');
    const sub = document.getElementById('loadingSub');

    if (step >= 3) {
        startFinalCountdown(videoId, req);
        return;
    }

    setTimeout(() => {
        if (step === 1) {
            /* ===== Monetag Step (fixed for Telegram) ===== */
            const showFunc = window['show_' + monetagZoneId];
            if (typeof showFunc === 'function') {
                txt.innerText = "Loading Partner Ad...";
                sub.innerText = "Please wait...";

                /* Direct show (no preload gating) */
                showFunc({
                    ymid: String(currentUserId),
                    requestVar: 'unlock_button'
                }).then((result) => {
                    console.log('Monetag ad completed:', result);
                    playMixedSequence(step + 1, videoId, link, req);
                }).catch((err) => {
                    console.error('Monetag ad failed:', err);
                    hideOverlay();
                    const msg = (err && (err.message || err.error || JSON.stringify(err))) || 'unknown';
                    if (tg.showAlert) tg.showAlert('Monetag error: ' + msg);
                    else showToast('Monetag error: ' + msg);
                    tg.HapticFeedback?.notificationOccurred('error');
                });
            } else {
                hideOverlay();
                const m = 'Monetag SDK load hoyni.\nStatic: ' + (window.__mtStatic||'pending') + '\nDynamic: ' + (window.__mtDyn||'pending') + '\nZone: ' + monetagZoneId + '\nURL: ' + monetagSdkUrl;
                if (tg.showAlert) tg.showAlert(m); else showToast(m);
            }
        } else {
            /* ===== Adsgram Step ===== */
            txt.innerText = "Loading Video Ad...";
            sub.innerText = "Please wait...";

            if (window.Adsgram && isInsideTelegram() && adsgramIds.length > 0) {
                const blockId = adsgramIds[0];
                try {
                    const AdController = window.Adsgram.init({ blockId: blockId });
                    AdController.show()
                        .then((result) => {
                            console.log('✅ Adsgram ad completed:', result);
                            playMixedSequence(step + 1, videoId, link, req);
                        })
                        .catch((err) => {
                            /* ❌ Adsgram failed → NO unlock */
                            console.error('❌ Adsgram ad failed:', err);
                            hideOverlay();
                            showToast("❌ অ্যাড দেখতে হবে! আবার চেষ্টা করুন।");
                            tg.HapticFeedback?.notificationOccurred('error');
                            return; // ⛔ IMPORTANT
                        });
                } catch (e) {
                    console.error('❌ Adsgram exception:', e);
                    hideOverlay();
                    showToast("❌ অ্যাড সিস্টেমে সমস্যা! আবার চেষ্টা করুন।");
                    return;
                }
            } else {
                /* Adsgram না থাকলে final countdown-এ যাও */
                console.warn('⚠️ Adsgram not available, proceeding to final step');
                playMixedSequence(step + 1, videoId, link, req);
            }
        }
    }, 500);
}

function incrementViewCount(videoId) {
    const storageKey = 'viewed_event_' + videoId;
    if(localStorage.getItem(storageKey)) return;
    const vidRef = ref(db, 'videos/' + videoId + '/view_count');
    runTransaction(vidRef, (currentViews) => (currentViews || 0) + 1)
        .then(() => { localStorage.setItem(storageKey, 'true'); })
        .catch(err => console.error("View update failed", err));
}

function trackUnlock(videoId) {
    const today = new Date().toISOString().slice(0,10);
    const unlockRef = ref(db, 'analytics/unlocks/' + today + '/' + videoId);
    runTransaction(unlockRef, (c) => (c || 0) + 1).catch(()=>{});
    const userRef = ref(db, 'analytics/users/' + currentUserId + '/unlocks');
    runTransaction(userRef, (c) => (c || 0) + 1).catch(()=>{});
}

function startFinalCountdown(videoId, req) {
    let count = 5;
    const txt = document.getElementById('loadingText');
    const sub = document.getElementById('loadingSub');
    txt.innerText = `✅ Verification Successful!`;
    sub.innerText = `Unlocking in ${count} seconds...`;

    const timer = setInterval(() => {
        count--;
        if (count > 0) {
            sub.innerText = `Unlocking in ${count} seconds...`;
        } else {
            clearInterval(timer);
            doUnlock(videoId, req);
            hideOverlay();
        }
    }, 1000);
}

function showOverlay(msg) { document.getElementById('loadingOverlay').style.display = 'flex'; document.getElementById('loadingText').innerText = msg; }
function hideOverlay() { document.getElementById('loadingOverlay').style.display = 'none'; }
function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.style.display = 'block';
    t.style.animation = 'none'; void t.offsetWidth;
    t.style.animation = 'toastIn .35s ease both';
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(()=>t.style.display='none', 3000);
}

function renderLinks() {
    const d=document.getElementById('linkList');
    d.innerHTML='';
    menuLinks.forEach(l => {
        d.innerHTML += `
        <div class="card" style="padding:15px;display:flex;align-items:center;gap:15px;">
            <i class="fas fa-link" style="color:#8b5cf6;font-size:18px"></i>
            <div style="flex:1;font-weight:600;font-size:14px;color:#241f3d;">${l.title}</div>
            <a href="${l.url}" target="_blank" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;padding:7px 18px;border-radius:50px;text-decoration:none;font-size:12px;font-weight:600;box-shadow:0 6px 16px rgba(236,72,153,.3)">Open</a>
        </div>`;
    });
}

function renderLiked() {
    const d=document.getElementById('likedCards');
    const l=getLiked();
    const v=allVideos.filter(x=>l.includes(x.id));
    d.innerHTML = v.length?'':'<p class="empty-text">💔 পছন্দের ভিডিও নেই</p>';
    v.forEach(x=>d.appendChild(createCard(x)));
}
window.nav = (id, btn) => { ['homeSec','likedSec','tutSec','linkSec'].forEach(s=>document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); if(id==='homeSec') document.getElementById('mainContent').style.display='block'; tg.HapticFeedback?.selectionChanged(); }
window.setFilter = (id, btn) => { currentFilter=id; renderFilters(); renderCards(); tg.HapticFeedback?.selectionChanged(); }
document.getElementById('searchInput').oninput = renderCards;
function getLiked(){ return JSON.parse(localStorage.getItem('likes')||'[]'); }
window.toggleLike=(id)=>{ let l=getLiked(); if(l.includes(id)) l=l.filter(x=>x!==id); else l.push(id); localStorage.setItem('likes',JSON.stringify(l)); renderCards(); renderLiked(); tg.HapticFeedback?.impactOccurred('light'); }
function getProgress(id){ return parseInt(localStorage.getItem('p_'+id)||0); }
function getDaily(){ const d=JSON.parse(localStorage.getItem('daily')||'{}'); return d.date===new Date().toDateString()?d.count:0; }
function incDaily(){ localStorage.setItem('daily', JSON.stringify({date:new Date().toDateString(), count:getDaily()+1})); }

window.openSingle = (id) => {
    const v = allVideos.find(x => x.id === id);
    if(!v) return;
    document.getElementById('mainContent').style.display='none';
    document.getElementById('singleView').classList.add('active');
    document.getElementById('singleCardContainer').innerHTML='';
    document.getElementById('singleCardContainer').appendChild(createCard(v));
    const newUrl = window.location.pathname + '?file=' + id;
    window.history.pushState({ path: newUrl }, '', newUrl);
}

window.closeSingle = () => {
    document.getElementById('singleView').classList.remove('active');
    document.getElementById('mainContent').style.display='block';
    window.history.pushState({}, '', window.location.pathname);
    renderCards();
}

init();
</script>
</body>
